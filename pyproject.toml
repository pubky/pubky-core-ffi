[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "pubkycore"
dynamic = ["version"]
description = "Python bindings for Pubky Core"
readme = "bindings/python/README.md"
requires-python = ">=3.9"
license = "MIT"

[project.urls]
Repository = "https://github.com/pubky/pubky-core-ffi"

[tool.maturin]
bindings = "uniffi"
locked = true
